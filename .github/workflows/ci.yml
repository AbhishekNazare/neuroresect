name: Research quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scientific-engine:
    name: Scientific correctness and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check packages apps/api workers tests
      - run: mypy packages/neurocore/neurocore apps/api/neuroresect_api
      - run: pytest --junitxml=artifacts/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-test-results
          path: artifacts/test-results.xml
  workstation:
    name: Workstation build and browser flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: python scripts/smoke_api.py
      - run: docker compose logs --tail=100
        if: failure()
      - run: docker compose down
        if: always()
