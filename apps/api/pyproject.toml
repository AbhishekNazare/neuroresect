[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroresect-api"
version = "0.1.0"
description = "Persistent research API for NeuroResect"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
worker = ["celery[redis]>=5.4,<6", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroresect_api*"]
