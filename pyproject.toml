[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/neurocore", "apps/api", "."]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "node_modules", "apps/web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [".venv", "node_modules"]
